<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .contenedor {
            text-align: center;
        }

        .girasol {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.4s ease;
            user-select: none;
        }

        .girasol:hover {
            transform: scale(1.08);
        }

        .texto {
            margin-top: 20px;
            font-size: 20px;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="girasol" onclick="iniciar()">🌻</div>

        <div class="texto" id="mensaje">
            Toca el girasol...
        </div>
    </div>

    <script>
        function iniciar() {
            document.getElementById("mensaje").innerHTML =
                "Tengo algo especial para ti 💛";

            document.querySelector(".girasol").style.transform =
                "scale(1.3)";
        }
    </script>

</body>
</html>
